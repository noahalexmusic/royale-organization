<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | The Royale Organization</title>
  <meta name="theme-color" content="#090B12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=31">
  <style>
    .account-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #090B12;
      color: #fff;
      font-family: Barlow, Arial, sans-serif;
    }
    .account-panel {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      border: 1px solid #303747;
      border-radius: 18px;
      background: #151923;
    }
    .account-panel h1 { margin: 8px 0; }
    .account-panel p { color: #b9c1d1; }
    .account-panel label {
      display: block;
      margin: 18px 0 7px;
      font-weight: 600;
    }
    .account-panel input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #485064;
      border-radius: 9px;
      background: #0b0e16;
      color: white;
      font: inherit;
    }
    .account-panel button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #f4b942;
      color: #10131c;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .account-panel button:disabled { opacity: .6; cursor: wait; }
    .account-panel a { color: #f4b942; }
    #accountMessage { margin-top: 18px; }
  </style>
</head>
<body>
  <main class="account-wrap">
    <section class="account-panel">
      <a href="index.html">← Back to TRO</a>
      <h1>Create Your TRO Account</h1>
      <p>Join The Royale Organization community.</p>

      <form id="accountForm">
        <label for="displayName">Display name</label>
        <input id="displayName" required minlength="2" maxlength="40" autocomplete="nickname">

        <label for="email">Email address</label>
        <input id="email" type="email" required autocomplete="email">

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">

        <label for="playerTag">Clash Royale player tag (optional)</label>
        <input id="playerTag" placeholder="#GRU222VR" autocomplete="off">

        <button id="submitButton" type="submit">Create Account</button>
      </form>

      <p id="accountMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const form = document.getElementById("accountForm");
    const message = document.getElementById("accountMessage");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "Creating your account...";

      try {
        const response = await fetch("/api/members/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            displayName: document.getElementById("displayName").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
            playerTag: document.getElementById("playerTag").value.trim()
          })
        });

        const result = await response.json();

        message.textContent = result.message || "Unable to complete registration.";

        if (response.ok) {
          form.reset();
          message.textContent += " Check your inbox for your verification link.";
        }
      } catch {
        message.textContent = "Connection failed. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
